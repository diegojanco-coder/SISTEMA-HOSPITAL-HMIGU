name: Vaccination integration and UI
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'frontend-app/**'
      - '.github/workflows/vaccination-integration.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'frontend-app/**'
      - '.github/workflows/vaccination-integration.yml'
permissions:
  contents: read
jobs:
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: vacunacion_hmgu_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ci-only-password
      DB_NAME: vacunacion_hmgu_test
      JWT_SECRET: integration-test-only-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node --test test/integration/*.test.cjs
  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: [frontend, frontend-app]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - if: matrix.directory == 'frontend-app'
        run: npm install --no-save --package-lock=false vitest@2.1.9 jsdom@25.0.1 @testing-library/react@16.1.0 @testing-library/dom@10.4.0
      - if: matrix.directory == 'frontend-app'
        run: npx vitest run
